# Xanadu — nginx reverse proxy for the GoDaddy VPS (Phase 17).
# Install (Ubuntu/Debian):
#   sudo cp deploy/nginx/xanadu.conf /etc/nginx/sites-available/xanadu.conf
#   sudo ln -s /etc/nginx/sites-available/xanadu.conf /etc/nginx/sites-enabled/xanadu.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Certs: Let's Encrypt via certbot (--nginx fills in/rewrites the ssl lines) —
#   sudo certbot --nginx -d xanadu.com -d www.xanadu.com
# Replace xanadu.com throughout if deploying under a different domain.

# Redirect all HTTP → HTTPS (keeps the ACME challenge path open for renewals).
server {
    listen 80;
    listen [::]:80;
    server_name xanadu.com www.xanadu.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://xanadu.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xanadu.com www.xanadu.com;

    # Filled in by certbot --nginx on first issue; renewed automatically after.
    ssl_certificate     /etc/letsencrypt/live/xanadu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xanadu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # The contact API caps request bodies at 16 KB; enforce the same at the edge.
    client_max_body_size 16k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml;

    # Security headers (HSTS, COOP/CORP, nosniff, ...) are set by the app in
    # next.config.js + proxy.ts (per-request CSP nonce) — do NOT duplicate them
    # here, or the two layers will drift.

    # Immutable build output (Next sends Cache-Control: immutable) — skip logging it.
    location /_next/static/ {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # CRITICAL: the app rate-limits per X-Real-IP when TRUST_REAL_IP=1
        # (deploy/ecosystem.config.js). Without this line every visitor shares
        # one 'unknown' bucket = a site-wide 5/hr limit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
